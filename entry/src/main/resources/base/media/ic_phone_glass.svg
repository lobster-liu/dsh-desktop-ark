<svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 52 52">
  <defs>
    <!-- 玻璃球本体：左上偏冷的高光过渡到右下几乎透明 -->
    <radialGradient id="glass" cx="32%" cy="22%" r="98%">
      <stop offset="0" stop-color="#A6FFFFFF"/>
      <stop offset="0.45" stop-color="#33FFFFFF"/>
      <stop offset="1" stop-color="#0FFFFFFF"/>
    </radialGradient>
    <!-- 局部高光：小而聚的左上反光斑 -->
    <radialGradient id="spec" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFFFF"/>
      <stop offset="0.35" stop-color="#B8FFFFFF"/>
      <stop offset="0.7" stop-color="#33FFFFFF"/>
      <stop offset="1" stop-color="#00FFFFFF"/>
    </radialGradient>
    <!-- 高光核心：一小点亮斑，玻璃球「点」出来的地方 -->
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.72" stop-color="#F2FFFFFF"/>
      <stop offset="1" stop-color="#00FFFFFF"/>
    </radialGradient>
    <!-- 右下内壁的反射光，让球体有厚度 -->
    <radialGradient id="bounce" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#66FFFFFF"/>
      <stop offset="0.7" stop-color="#1FFFFFFF"/>
      <stop offset="1" stop-color="#00FFFFFF"/>
    </radialGradient>
  </defs>

  <circle cx="26" cy="26" r="25.4" fill="url(#glass)"/>
  <circle cx="26" cy="26" r="24.9" fill="none" stroke="#8CFFFFFF" stroke-width="1.2"/>
  <circle cx="26" cy="26" r="23" fill="none" stroke="#2EFFFFFF" stroke-width="1"/>

  <ellipse cx="30" cy="39.4" rx="9" ry="4.2" fill="url(#bounce)"/>

  <g transform="rotate(-28 17 14)">
    <ellipse cx="17" cy="14" rx="6.2" ry="4.2" fill="url(#spec)"/>
  </g>
  <g transform="rotate(-28 15.2 12.4)">
    <ellipse cx="15.2" cy="12.4" rx="2.4" ry="1.5" fill="url(#core)"/>
    <ellipse cx="14.6" cy="12.1" rx="1" ry="0.7" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <g transform="translate(12 12) scale(1.1667)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
  </g>
</svg>
